name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Lint changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No valid base SHA was supplied; linting the full repository."
            bun run lint
            exit 0
          fi

          mapfile -t FILES < <(
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" |
              grep -E '\.(cjs|js|jsx|mjs|ts|tsx)$' || true
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No JavaScript or TypeScript files changed."
          else
            printf 'Linting %s changed source files.\n' "${#FILES[@]}"
            bunx eslint "${FILES[@]}"
          fi
