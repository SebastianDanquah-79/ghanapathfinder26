name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: Test
        run: bun run test

      # The repository has a large pre-existing ESLint/Prettier baseline.
      # Lint files changed by this PR so unrelated legacy files do not block
      # delivery, while build and test still cover the complete application.
      - name: Lint changed TypeScript files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA...HEAD" -- '*.ts' '*.tsx'
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed TypeScript files to lint."
          else
            printf 'Linting %s changed TypeScript files.\n' "${#changed_files[@]}"
            bunx eslint "${changed_files[@]}" --rule 'prettier/prettier: off'
          fi
