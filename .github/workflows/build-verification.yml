name: build-verification

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - run: bun install --no-frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
