name: Build and Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_Kf0gw2PrIXQLy84iAhWcjCA8
      VERCEL_PROJECT_ID: prj_WFJa8kYNpkVT4uSA2OlfbeTzmFzk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Authenticate with Vercel
        run: vercel whoami --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Link Vercel project
        run: vercel link --project "$VERCEL_PROJECT_ID" --scope "ghanapathfinder1" --token "$VERCEL_TOKEN" --non-interactive
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN" --scope "ghanapathfinder1"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel output in GitHub Actions
        run: vercel build --prod --token "$VERCEL_TOKEN" --scope "ghanapathfinder1"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to Vercel
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --scope "ghanapathfinder1"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
